<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🧪 AI Lab</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
  // Theme before first paint (dark by default) — no flash of the wrong mode.
  try { var t = localStorage.getItem('ailab.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root { --r: 14px; --gap: 12px; font-size: 17px; }
  [data-theme="dark"] {
    --bg: #0d1520; --panel: #142133; --panel2: #1b2b40; --line: #2a3d57;
    --text: #e8dfc8; --dim: #a9a08c; --accent: #c9a54a; --accent-ink: #1a1408;
    --calm: #26394f; --ok: #6f9c7a; --warn: #b89558; --bad: #b97a6c; --me: #223a55;
  }
  [data-theme="light"] {
    --bg: #f5f2ec; --panel: #fbf9f4; --panel2: #ece6da; --line: #d6cdbb;
    --text: #1d2a3a; --dim: #5d6672; --accent: #8a6a1f; --accent-ink: #fff8e6;
    --calm: #e3ebf2; --ok: #4f7a5a; --warn: #8a6a2c; --bad: #8f5446; --me: #dfe8f1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  button, select, input, textarea { font: inherit; color: inherit; }
  /* 2026-11-24: fields with no own style showed the browser's white with pale text — unreadable */
  textarea, input[type=text], input[type=search], input[type=password], input[type=number], input:not([type]) {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea::placeholder, input::placeholder { color: var(--dim); opacity: 1; }
  textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent, var(--line)); outline-offset: 1px; }
  button { cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* slim top bar: ← ⌂ left, title, chips right */
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 48px; }
  .ib { background: none; border: 0; border-radius: 10px; min-width: 40px; height: 40px; font-size: 1.15rem; }
  .ib:hover, .ib:focus-visible { background: var(--panel2); outline: none; }
  .title { font-weight: 650; font-size: 1rem; white-space: nowrap; }
  .chips { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
  .chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line); font-size: .85rem; white-space: nowrap; }
  .spend .bar { width: 46px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .spend .bar i { display: block; height: 100%; background: var(--ok); width: 0; }

  main { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 1100px; margin: 0 auto; padding: var(--gap); gap: var(--gap); }
  .loading { margin: 25vh auto; font-size: 2rem; opacity: .6; }

  /* start: project row + path cards */
  .proj { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
  .proj select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 10rem; }
  .lock { font-size: .85rem; color: var(--dim); }
  .paths { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--gap); }
  .path { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
  .path:hover, .path:focus-visible { border-color: var(--accent); outline: none; }
  .path .sym { font-size: 2rem; line-height: 1; }
  .path .name { font-weight: 650; }
  .path .st { font-size: .8rem; color: var(--dim); margin-top: auto; }
  .path.off { opacity: .78; }
  .path.off .sym { filter: grayscale(.6); }

  /* calm "not switched on" card */
  .offcard { margin: 6vh auto 0; max-width: 520px; text-align: center; background: var(--calm);
    border: 1px solid var(--line); border-radius: var(--r); padding: 22px 18px; }
  .offcard .big { font-size: 2.6rem; }
  .offcard h2 { margin: 8px 0 4px; font-size: 1.15rem; }
  .offcard p { margin: 6px 0; color: var(--dim); }
  details { text-align: left; margin-top: 10px; }
  summary { cursor: pointer; color: var(--dim); }

  /* chat */
  .chat { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .picker { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .picker select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; max-width: 100%; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; min-height: 30vh; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--me); }
  .msg .meta { display: block; margin-top: 6px; font-size: .78rem; color: var(--dim); }
  .msg.err { border-color: var(--warn); }
  .composer { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: 0; background: var(--bg); padding-top: 6px; }
  .composer textarea { flex: 1; min-height: 52px; max-height: 40vh; resize: vertical; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; }
  .send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r); height: 52px; min-width: 56px; font-size: 1.3rem; }
  .send:disabled { opacity: .5; cursor: default; }
  .saved { font-size: .78rem; color: var(--dim); min-height: 1em; }

  dialog { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); color: var(--text); max-width: 92vw; }
  dialog { padding: 0; } dialog > form { padding: 16px; }   /* padding on the form, so a tap inside the box never counts as "outside" */
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog input[type=text] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  /* ⚙️ Settings → 🔑 Keys (2026-11-23) */
  .hint { margin: 6px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--calm, var(--panel2)); font-size: .95rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .legend { font-size: .9rem; color: var(--dim); flex-basis: 100%; } .legend summary { cursor: pointer; }
  .keys { max-width: 760px; margin: 0 auto; min-width: 0; overflow-wrap: anywhere; }
  /* 2026-11-24 Argus touch test: long model names widened the phone page to 658 px; controls were 39–42 px tall */
  .keys .picker select { flex: 1 1 100%; width: 100%; min-width: 0; text-overflow: ellipsis; }
  .keys .btn, .keys select, .keys input[type=text], .keys input[type=search], .keys summary, .keys .ib { min-height: 44px; }
  .keys .ib { min-width: 44px; }
  .keyrow { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 2fr) auto; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); margin: 10px 0; background: var(--panel); }
  .keyrow .st { font-size: .92rem; color: var(--dim); }
  .keyrow input { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: inherit; padding: 8px 10px; font: inherit; }
  .keyrow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .keyrow .btn { min-height: 44px; }
  .keyrow .msg { grid-column: 1 / -1; font-size: .92rem; min-height: 1.2em; }
  @media (max-width: 640px) { .keyrow { grid-template-columns: 1fr; } .keyrow .acts { justify-content: flex-start; } }
  .btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px 14px; }
  a.btn { color: inherit; text-decoration: none; display: inline-block; }
  .btn.pri { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  @media (max-width: 640px) {
    :root { --gap: 10px; }
    .title .full { display: none; }
    .chip .lbl, .spend .bar { display: none; }
    header { gap: 2px; padding: 6px 6px; }
    .ib { min-width: 36px; }
    .chips { gap: 4px; }
    .chip { padding: 4px 8px; }
    .msg { max-width: 94%; }
  }
  /* live preview: code ↔ steady preview */
  main.wide { max-width: none; }
  .split { height: calc(100dvh - 150px); min-height: 420px; display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 1.2fr); gap: var(--gap); min-height: 0; }
  .pane { display: flex; flex-direction: column; gap: 8px; min-height: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
  .bar2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 6px 10px; font-size: .9rem; }
  .tab[aria-pressed="true"] { border-color: var(--accent); font-weight: 650; }
  .tab .dot { color: var(--warn); }
  .code { flex: 1; min-height: 40vh; width: 100%; resize: vertical; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); padding: 10px; font: 15px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; tab-size: 2; }
  .pvpane { min-height: 0; }
  .pane a.ib { color: inherit; display: inline-grid; place-items: center; text-decoration: none; }
  .frame { flex: 1; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-height: 0; }
  .note { font-size: .82rem; color: var(--dim); min-height: 1.2em; }
  #pvsave { margin-left: auto; }
  .warnbox { background: var(--calm); border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; height: auto; }
    .pvpane { order: -1; position: sticky; top: 52px; height: 46dvh; z-index: 2; }   /* preview stays in view above the code */
    .code { min-height: 34vh; }
  }
  /* agent */
  .agent { display: flex; flex-direction: column; gap: 10px; }
  .agent textarea { width: 100%; min-height: 90px; resize: vertical; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--panel); padding: 10px; }
  .runbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; }
  .step .hd { display: flex; gap: 8px; align-items: baseline; }
  .step .n { color: var(--dim); font-size: .8rem; min-width: 1.6em; }
  .step .why { color: var(--dim); font-size: .9rem; }
  .step pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font-size: .82rem; max-height: 40vh; overflow: auto; }
  .step.held { border-color: var(--warn); }
  .step .hd b { flex-shrink: 0; }
  .step .hd > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  .step.err { border-color: var(--bad); }
  .final { background: var(--calm); border-radius: var(--r); padding: 10px 12px; }
  /* ⚖️ Compare (M8) */
  .lanes { display: flex; flex-direction: column; gap: 8px; }
  .lanerow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; }
  .lanerow select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; max-width: 100%; flex: 1 1 150px; }
  .cmpgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .lanecard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .lanecard h3 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
  .lanecard .m { display: flex; justify-content: space-between; gap: 8px; }
  .lanecard iframe { width: 100%; height: 240px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .lanecard.best { border-color: var(--accent); }
  .cmpform input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
  /* 🛠 workbench (2026-11-22): the Lab's front page — Files · Code · Agent, changes first */
  [hidden] { display: none !important; }
  header .projsel { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; min-width: 6.5rem; max-width: 40vw; flex: 0 1 15rem; }
  header #waiting { border-color: var(--warn); }
  .wbtabs { display: none; gap: 6px; }
  .wbtabs .tab { flex: 1; padding: 10px 6px; font-size: 1rem; }
  .wb { flex: 1; display: grid; grid-template-columns: minmax(170px, 230px) minmax(0, 1.35fr) minmax(320px, 1fr); gap: var(--gap);
    height: calc(100dvh - 48px - 2 * var(--gap)); min-height: 0; }
  /* 2026-11-23: panes can be resized (drag the gutter, or focus it and use ← →) and moved (◀ ▶ in each pane bar) */
  .wb.custom { gap: 0; }
  .gutter { width: 12px; cursor: col-resize; touch-action: none; -webkit-user-select: none; user-select: none; border: 0; background: transparent; padding: 0;
    position: relative; align-self: stretch; }
  .gutter::after { content: ""; position: absolute; left: 4px; right: 4px; top: 0; bottom: 0; border-radius: 4px; background: var(--line); }
  .gutter:hover::after, .gutter:focus-visible::after { background: var(--accent); }
  .panebar { display: flex; align-items: center; gap: 4px; }
  .panebar h2 { flex: 1; }
  /* 2026-11-23 clarity pass: one plain line under each pane title; ⤢ enlarge for the big text boxes */
  .panesub { margin: -2px 0 6px; font-size: .92rem; color: var(--dim); }
  .boxwrap { position: relative; display: flex; flex-direction: column; min-height: 0; }
  .boxwrap > textarea { flex: 1; resize: vertical; padding-right: 48px; }
  .boxwrap > .grow { position: absolute; top: 6px; right: 6px; z-index: 2; min-width: 40px; min-height: 40px; }
  .boxwrap.big { position: fixed; inset: 4vh 4vw; z-index: 60; background: var(--panel); border: 2px solid var(--accent); border-radius: var(--r);
    padding: 12px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
  .boxwrap.big > textarea { height: 100% !important; min-height: 0 !important; max-height: none; resize: none; font-size: 1.05rem; }
  .filesed > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; font-weight: 650; }
  .filesed[open] { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
  .waitnone { color: var(--dim); font-size: .95rem; margin: 4px 0 10px; }
  .panebar .ib { min-width: 36px; min-height: 36px; opacity: .7; }
  .panebar .ib:hover, .panebar .ib:focus-visible { opacity: 1; }
  .wb > .pane { overflow: auto; min-width: 0; }
  .wb select, .wb textarea { max-width: 100%; min-width: 0; }
  .wb h2 { margin: 0; font-size: 1rem; }
  .wbfiles #pvtabs { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
  .wbfiles .tab { text-align: left; overflow-wrap: anywhere; }
  .wbcode .code { min-height: 200px; }
  .wbcode .frame { min-height: 300px; }
  .wbfile { font-weight: 650; overflow-wrap: anywhere; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-left: auto; }
  .seg button { border: 0; background: var(--panel2); padding: 7px 12px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .wbcode #pvsave { margin-left: 0; }
  .wbagent textarea { min-height: 110px; }
  .wbagent .step { background: var(--bg); }
  .changes { display: flex; flex-direction: column; gap: 8px; }
  .changes:empty { display: none; }
  .chg { border: 1px solid var(--warn); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
  .chg .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .chg .hd b { overflow-wrap: anywhere; }
  .diff { margin: 6px 0; padding: 8px; border-radius: 8px; background: var(--panel2); font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 38vh; overflow: auto; }
  .diff .add { color: var(--ok); } .diff .del { color: var(--bad); } .diff .hunk { color: var(--dim); }
  .chg input { padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); max-width: 9rem; }
  .drawer { margin-top: 0; border-top: 1px solid var(--line); padding-top: 6px; }
  /* 2026-11-24 workflow build: picture first (Before beside Now), robot verdict, question cards, plan list */
  .result { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 12px; }
  .shipbar { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 12px; } .shipbar > .btn { align-self: flex-start; min-height: 48px; font-size: 17px; }
  .shipbox { border: 1px solid var(--line, #8886); border-radius: 10px; padding: 10px; } .shipbox input[type=text], .shipbox select { min-height: 44px; font-size: 17px; } .shipbox .chk { min-height: 44px; display: inline-flex; align-items: center; }
  .result[hidden], .ba[hidden] { display: none; }
  .ba { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
  .ba figure, .shots figure { margin: 0; min-width: 0; }
  .ba figcaption, .shots figcaption { font-weight: 600; margin-bottom: 4px; }
  .ba iframe { width: 100%; height: min(62vh, 560px); border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 8px; }
  .shots img { width: 100%; border: 1px solid var(--line); border-radius: 10px; display: block; }
  .codefold > summary, .steplog > summary { cursor: pointer; padding: 11px 0; color: var(--dim); }
  .codefold { display: flex; flex-direction: column; gap: 8px; } .steplog { display: flex; flex-direction: column; gap: 8px; }
  .step.plan > div { padding: 3px 0; font-size: 1.05rem; } .step.retry { border-style: dashed; }
  #askdlg { width: min(640px, 92vw); } #askdlg form { display: flex; flex-direction: column; gap: 10px; }
  .qitem { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); }
  .qitem .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .qitem .opts .btn { min-height: 44px; } .qitem .opts .btn[aria-pressed=true] { outline: 3px solid var(--accent, var(--ok)); outline-offset: 1px; }
  .qitem .rec { color: var(--dim); font-size: .92rem; margin-top: 6px; }
  .planlist { margin: 0; padding-left: 1.4em; } .planlist li { padding: 3px 0; }
  /* 2026-11-24 Argus touch test: plan Go / Later / Send change were 42 px */
  #askdlg .btn, #askdlg input[type=text] { min-height: 44px; } .planlist li { overflow-wrap: anywhere; }
  .askrow { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; font-size: .95rem; }
  /* 📣 live stage card (2026-11-24, "I need to know what is going on") — one big plain line, time + money so far */
  .stagebox { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel2); }
  .stagebox .si { font-size: 1.7rem; line-height: 1; }
  .stagebox .st { font-size: 1.08rem; font-weight: 600; }
  .stagebox .sm { font-size: .92rem; color: var(--dim); margin-top: 2px; }
  .stagebox.busy { border-color: var(--accent); }
  .stagebox.busy .si { animation: stagepulse 1.6s ease-in-out infinite; }
  @keyframes stagepulse { 50% { transform: scale(1.12); opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { .stagebox.busy .si { animation: none; } }
  /* 📦 What was made + ✏️ Change it (2026-11-24: "I need the output more available and obvious") */
  .madecard, .changebox { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px;
    border: 1px solid var(--accent); background: var(--panel); }
  .madecard h3, .changebox h3 { margin: 0; font-size: 1.08rem; }
  .mtiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
  .mtile { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); min-width: 0; }
  .wherepath { display: block; overflow-wrap: anywhere; font-size: .85em; opacity: .85; }
  .whererow { padding: 8px 0; border-bottom: 1px solid var(--line, #3a4658); }
  .mtile .mhd { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; overflow-wrap: anywhere; }
  .mtile img { width: 100%; height: auto; border-radius: 8px; }
  .mtile .btn { min-height: 44px; display: inline-flex; align-items: center; }
  .docview.short { max-height: 40vh; }
  .changebox textarea { width: 100%; min-height: 66px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: inherit; padding: 10px; font: inherit; }
  .changebox .btn { min-height: 44px; }

<script>
"use strict";
const $ = (s, el) => (el || document).querySelector(s);
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem("ailab." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ailab." + k, JSON.stringify(v)); } catch (e) {} },
};
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  let j = {}; try { j = await r.json(); } catch (e) {}
  j.status = r.status; return j;
}

const PATHS = [
  { id: "chat", flag: "router", sym: "💬", name: "Ask models", tip: "Pick a model, ask, see the cost of every answer." },
  { id: "preview", flag: "preview", sym: "👁", name: "Live preview", tip: "Code on one side, the running page on the other." },
  { id: "agent", flag: "agent", sym: "🤖", name: "Agent", tip: "Plan → write → run → check, step by step, with a Stop button." },
  { id: "review", flag: null, sym: "📋", name: "Review", tip: "Send a demo to Hermes for your OK; apply or reject held agent writes." },
  { id: "compare", flag: "compare", sym: "⚖️", name: "Compare models", tip: "Same task, 2–4 models, side by side." },
  { id: "live", flag: "live", sym: "🪞", name: "Show & change", tip: "A running page: Now beside New. Say what to change, see it, keep it or throw it away." },
  { id: "prompt", flag: "prompt", sym: "📝", name: "Prompt builder", tip: "Say your idea → get a build prompt in your format → send it to the Lab agent or to Claude." },
  { id: "memory", flag: "memory", sym: "🧠", name: "Memory", tip: "What the Lab knows about you — copied from your Claude setup, kept up to date, yours to change." },

let S = null;                          // server state
let view = "start", trail = [];        // ← retraces this trail
let chatLog = [];

/* ---------- top bar ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("ailab.theme", t); } catch (e) {}
  $("#theme").textContent = t === "dark" ? "☀️" : "🌙";
}
$("#settings").onclick = () => go("settings");
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("#theme").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
$("#full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => {});
};
/* Back / Home (2026-11-22 fix): inside the Lab they walk the trail; at the start page they return to Hermes.
   Where Hermes is: config hermes_url, else the ?from= the Hermes card passes, else the page that linked here. */
const okUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) && x.origin !== location.origin ? x.href : ""; } catch (e) { return ""; } };
(function rememberFrom() {
  const q = new URLSearchParams(location.search), f = okUrl(q.get("from") || "") || okUrl(document.referrer || "");
  if (f) store.set("from", f);
  if (q.has("from")) { q.delete("from"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "")); }
})();
const backUrl = () => okUrl((S && S.hermes_url) || "") || okUrl(store.get("from", "") || "");
const homeUrl = () => { const u = okUrl((S && S.hermes_url) || ""); if (u) return u; const f = okUrl(store.get("from", "") || ""); return f ? new URL(f).origin + "/" : ""; };
function navNote(t) {
  let n = $("#navnote"); if (!n) { n = h("div", { id: "navnote", role: "status" }); document.body.append(n); }
  n.textContent = t; n.classList.add("on"); clearTimeout(navNote.t); navNote.t = setTimeout(() => n.classList.remove("on"), 2600);
}
function leave(u) { if (u) location.href = u; else navNote("This is the Lab's first page. Open the Lab from its Hermes card once and ← ⌂ will go back there."); }
function goBack() { if (trail.length) { view = trail.pop(); render(); } else leave(backUrl()); }
function goHome() { if (view !== "start") { trail = []; view = "start"; render(); } else leave(homeUrl()); }
$("#back").onclick = goBack;
$("#home").onclick = goHome;
/* the phone's / browser's own Back button walks the same trail */
try { history.replaceState({ lab: 1 }, ""); history.pushState({ lab: 2 }, ""); } catch (e) {}
addEventListener("popstate", () => {
  if (trail.length) { try { history.pushState({ lab: 2 }, ""); } catch (e) {} goBack(); }
  else if (backUrl()) location.href = backUrl();
  else history.back();
});
function go(v) { if (v !== view) { trail.push(view); view = v; render(); } }

function paintBar() {
  const connected = S.mode === "connected";
  $("#mode").innerHTML = "";
  $("#mode").append(connected ? "🔌" : "🏝", h("span", { class: "lbl" }, connected ? "Hermes" : "Standalone"));
  $("#mode").title = connected ? "Connected to Hermes — one budget, Hermes holds the keys" : "Standalone — own keys, own $ cap";
  const sp = S.spend || {};
  if (sp.today_usd == null) { $("#spendtxt").textContent = "?"; $("#spendbar").style.width = "0"; return; }
  $("#spendtxt").replaceChildren(`$${sp.today_usd.toFixed(2)}`, h("span", { class: "cap" }, ` / $${sp.cap_usd.toFixed(2)}`));
  const pct = Math.min(100, (sp.today_usd / (sp.cap_usd || 1)) * 100);
  $("#spendbar").style.width = pct + "%";
  $("#spendbar").style.background = pct >= 90 ? "var(--bad)" : pct >= 70 ? "var(--warn)" : "var(--ok)";
}

/* ---------- project ---------- */
const curProject = () => S.projects.find(p => p.id === store.get("project", "scratch")) || S.projects[0];
function projectRow() {            // the switcher lives in the top bar now; views keep only the 🔒 note
  const p = curProject();
  return p.sensitive ? h("div", { class: "lock" }, "🔒 This project stays on this computer — Ollama only") : document.createDocumentFragment();
}
function paintProjects() {
  const sel = $("#projsel"); sel.innerHTML = "";
  S.projects.forEach(p => sel.append(h("option", { value: p.id, selected: p.id === curProject().id }, (p.sensitive ? "🔒 " : "📁 ") + p.name)));
  sel.append(h("option", { value: "__new" }, "➕ New project…"));
}
$("#projsel").onchange = e => {
  if (e.target.value === "__new") { paintProjects(); newProject(); return; }
  store.set("project", e.target.value); chatLog = []; render();
};
$("#projnew").onclick = () => newProject();
/* 📍 Where (2026-11-24, Scott: "easier ways to know where things are in project storage") */
function copyText(t, note) {
  const ok = () => { note.textContent = "📋 Copied: " + t; };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, () => { note.textContent = t; });
  else { const ta = h("textarea", {}, t); document.body.append(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch (e) { note.textContent = t; } ta.remove(); }
}
async function showWhere() {
  const d = $("#wheredlg"), body = $("#wherebody"), note = $("#wherenote"), p = curProject();
  body.textContent = "⏳"; note.textContent = ""; d.showModal();
  const w = await api(`/api/where?project=${encodeURIComponent(p.id)}`);
  if (!w.ok) { body.textContent = `${w.icon || "⚠️"} ${w.message || "Couldn't find the folder."}`; return; }
  const row = (icon, label, path, which) => h("div", { class: "whererow" },
    h("div", {}, h("b", {}, `${icon} ${label}`)), h("code", { class: "wherepath" }, path),
    h("div", { class: "runbar" },
      h("button", { class: "btn", type: "button", onclick: () => copyText(path, note) }, "📋 Copy path"),
      which ? h("button", { class: "btn", type: "button", onclick: async () => { const r = await api("/api/where/open", { project: p.id, which }); note.textContent = r.message || (r.ok ? "📂 Opened" : "⚠️ Couldn't open it"); } }, "📂 Open") : null));
  body.innerHTML = "";
  body.append(h("p", { class: "note" }, `${p.name}: ${w.files} files · ${w.mb} MB`),
    row("📁", "Project folder", w.folder, "folder"), row("🖼", "Pictures", w.pictures, "pictures"),
    row("📝", "Documents", w.docs, "docs"), row("🎨", "Gallery copies (Image Studio)", w.gallery, "gallery"),
    w.backup ? h("p", { class: "note" }, `🗄 Old hidden copy kept as a backup: ${w.backup}`) : null);
}
$("#projwhere").onclick = () => showWhere();
function paintWaiting(n) {
  const c = $("#waiting"); c.hidden = !n; c.textContent = n ? `✋ ${n}` : "";
  c.setAttribute("aria-label", n ? `${n} change${n === 1 ? "" : "s"} waiting for your OK` : "");

$("#waiting").onclick = () => { store.set("wbtab", "code"); if (view !== "start") { trail.push(view); view = "start"; } render(); };
function newProject() {
  const d = $("#newproj"); $("#pname").value = ""; $("#psens").checked = false;
  d.onclose = async () => {
    if (d.returnValue !== "ok" || !$("#pname").value.trim()) return;

    if (r.ok) { S.projects.push(r.project); store.set("project", r.project.id); render(); }
  };

}

/* ---------- ⚙️ Settings → 🔑 Keys (2026-11-23) ----------
   Standalone: keys go to the OS keyring, else ~/.config/ailab/keys.env (owner-only). Never shown back; Test = list models.
   Connected: Hermes holds every hosted key (Vault) — this page shows Hermes's answer and links to its Settings. */
function settingsView() {
  const box = h("div", { class: "keys" }, h("h2", {}, "⚙️ Settings"), h("h3", {}, "🔑 Keys"), h("p", { class: "note", id: "keysnote" }, "⏳"));
  api("/api/keys").then(k => {
    const note = $("#keysnote");
    if (k.mode === "connected") {

      const hu = (homeUrl() || "http://127.0.0.1:8780/").replace(/\/$/, "");      // Hermes dashboard default port is 8780

        " ", h("span", { class: "note" }, "Paste the key there, Save, then switch the provider on. Come back and reload this page.")));
      if (k.note) box.append(h("p", { class: "note" }, k.note));
      (k.providers || []).forEach(p => box.append(h("div", { class: "keyrow" },
        h("div", {}, h("b", {}, `${p.icon} ${p.id}`)),
        h("div", { class: "st" }, !p.listed ? "⏸ Off in Hermes, or no key yet — turn it on in Hermes → Settings → API keys" : p.set ? `✅ key in Hermes · ${p.models.length} model${p.models.length === 1 ? "" : "s"}` : "⛔ no key in Hermes",
          ["qwen", "kimi", "gemini"].includes(p.id) ? h("div", {}, "⚠️ Goes straight to " + ({qwen: "Alibaba", kimi: "Moonshot", gemini: "Google"})[p.id] + " — not the private (no-data-kept) 🌐 OpenRouter route. 🔒 strict filters.") : null),
        h("div", { class: "acts" }))));
      return;
    }
    note.textContent = k.store && k.store.keyring ? "Keys are saved in your OS keyring (service “ailab”). They are never shown back."
      : `No OS keyring found — keys are saved owner-only in ${k.store ? k.store.file : "keys.env"}. They are never shown back.`;
    const SRC = { keyring: "✅ in OS keyring", file: "✅ in keys.env", environment: "✅ from the environment", none: "⛔ not set" };
    (k.providers || []).forEach(p => {
      const inp = h("input", { type: "password", autocomplete: "off", spellcheck: "false", placeholder: p.set ? "Paste a new key to replace it" : "Paste the key", "aria-label": `${p.id} key` });
      const st = h("div", { class: "st" }, SRC[p.source] || p.source), msg = h("div", { class: "msg" }, p.problem || "");
      const say = (t, bad) => { msg.textContent = t; msg.style.color = bad ? "var(--bad, inherit)" : ""; };
      const save = h("button", { class: "btn pri", type: "button", onclick: async () => {
        if (!inp.value.trim()) { say("Paste the key first.", true); inp.focus(); return; }
        save.disabled = true; say("Saving…");

        save.disabled = false;
        if (!r.ok) { say("✗ " + (r.message || r.code || r.status), true); return; }
        st.textContent = SRC[r.source]; say(`Saved to the ${r.source === "file" ? "key file" : "OS keyring"}. Press Test to check it.`);
      } }, "💾 Save");
      const test = h("button", { class: "btn", type: "button", onclick: async () => {
        test.disabled = true; say("Testing — asking the provider for its model list…");
        const r = await api("/api/keys/test", { provider: p.id }); test.disabled = false;

/* ---------- 🧠 Memory (2026-11-24 M1) ----------
   One card per subject. [claude-import] lines come from his Claude setup (🔄 replaces them), [lab] lines the Lab

const MSRC = { "claude-import": "📥 from Claude", lab: "🧪 Lab saved", scott: "✋ you added" };
function memoryView() {
  if (!S.flags.memory) return [offCard("memory", "🧠", "Memory", "the Memory build (M1–M3)")];
  const box = h("div", { class: "keys" }, h("h2", {}, "🧠 What the Lab knows about you"),

  const dl = h("button", { class: "btn", type: "button", onclick: async () => {
    const r = await api("/api/memory/review", {});

        const w = await api("/api/memory/save", { name: sub.name, description: r.subject.description, lines });
        say(w.ok ? `💾 Saved “${sub.name}”.` : "✗ " + (w.message || w.code));

  }
  async function load() {

    subs.forEach(s => list.append(card(s)));
  }
  load();
  return [box];
}

function offCard(flag, sym, name, later) {

      h("p", {}, later ? `This part arrives in build step ${later}.`
        : "Each part is switched on by Scott, one at a time, after it is tested (step M7). Order: 💬 Ask models → 👁 Live preview → 🤖 Agent → ⚖️ Compare.")));
}
function diffPre(text) {
  const pre = h("pre", { class: "diff" });
  String(text || "").split("\n").forEach(l => pre.append(h("span", { class:
    l.startsWith("@@") ? "hunk" : l.startsWith("+") && !l.startsWith("+++") ? "add" : l.startsWith("-") && !l.startsWith("---") ? "del" : "" }, l + "\n")));
  return pre;
}
/* ⤢ Enlarge (2026-11-23): wraps a textarea; the button (or Esc) toggles a near-full-screen view. Typing is never lost —
   it is the same element, just restyled. */
function growBox(ta, label) {
  const wrap = h("div", { class: "boxwrap" });
  const btn = h("button", { class: "ib grow", type: "button", title: `Enlarge the ${label}`, "aria-label": `Enlarge the ${label}`, "aria-pressed": "false" }, "⤢");
  const set = (on) => { wrap.classList.toggle("big", on); btn.textContent = on ? "⤡" : "⤢"; btn.setAttribute("aria-pressed", String(on));
    btn.title = btn.ariaLabel = `${on ? "Shrink" : "Enlarge"} the ${label}`; ta.focus(); };
  btn.onclick = () => set(!wrap.classList.contains("big"));
  wrap.addEventListener("keydown", e => { if (e.key === "Escape" && wrap.classList.contains("big")) { e.preventDefault(); e.stopPropagation(); set(false); } });
  wrap.append(ta, btn);
  return wrap;
}

/* 🧱 Pane layout (2026-11-23): order + widths live on this device (store "wblayout"); the code pane is the flexible one.
   Gutters are real buttons: drag with pointer capture, or focus and use ← → (16px a step). ◀ ▶ swap a pane with its neighbour. */
const PANES = ["files", "code", "agent"], PANE_MIN = { files: 150, code: 280, agent: 300 };
function wbLayout() { const l = store.get("wblayout", null); return l && Array.isArray(l.order) && l.order.length === 3 && PANES.every(x => l.order.includes(x)) ? { order: l.order, widths: l.widths || {} } : { order: [...PANES], widths: {} }; }
function wbSave(l) { store.set("wblayout", l); }
function wbResetLayout() { store.set("wblayout", null); render(); }
function layoutPanes(sec, panes) {
  const l = wbLayout();
  sec.classList.add("custom");               // 2026-11-23: gutters are grid cells too — always lay out all 5 columns (first launch wrapped)
  sec.replaceChildren();
  const cols = [];
  l.order.forEach((id, i) => {
    if (i) { sec.append(gutter(l.order[i - 1], id)); cols.push("12px"); }
    sec.append(panes[id]);
    cols.push(id === "code" ? "minmax(0, 1fr)" : l.widths[id] ? `${l.widths[id]}px` : (id === "files" ? "minmax(170px, 230px)" : "minmax(320px, 1fr)"));
  });
  sec.style.gridTemplateColumns = cols.join(" ");
  function gutter(a, b) {
    const target = a !== "code" ? a : b, sign = a !== "code" ? 1 : -1;   // the side pane this gutter resizes, and which way grows it
    const g = h("button", { class: "gutter", type: "button", role: "separator", "aria-orientation": "vertical",
      "aria-label": `Resize ${target} pane. Drag, or use the left and right arrow keys.` });
    const cur = () => l.widths[target] || panes[target].getBoundingClientRect().width;
    const clamp = (w) => Math.round(Math.max(PANE_MIN[target], Math.min(w, sec.clientWidth - 24 - PANE_MIN.code - 150)));
    const apply = (w) => { l.widths[target] = clamp(w); wbSave(l); layoutPanes(sec, panes); };
    let x0 = 0, w0 = 0, live = null;
    g.addEventListener("pointerdown", e => { if (e.button !== 0) return; x0 = e.clientX; w0 = cur(); live = w0; g.setPointerCapture(e.pointerId); e.preventDefault(); });
    g.addEventListener("pointermove", e => { if (!g.hasPointerCapture(e.pointerId)) return; live = clamp(w0 + sign * (e.clientX - x0));
      const c = [...cols]; c[l.order.indexOf(target) * 2] = `${live}px`; sec.style.gridTemplateColumns = c.join(" "); });   // cols, not a split string: "minmax(0, 1fr)" holds a space
    g.addEventListener("lostpointercapture", () => { if (live != null) apply(live); live = null; });
    g.addEventListener("keydown", e => { if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return; e.preventDefault();
      const k = [...sec.querySelectorAll(".gutter")].indexOf(g); apply(cur() + (e.key === "ArrowRight" ? 16 : -16) * sign); sec.querySelectorAll(".gutter")[k].focus(); });
    return g;
  }
}
function paneBar(id, title, sec, panes) {
  const mv = (d) => { const L = wbLayout(), o = [...L.order], j = o.indexOf(id), k = j + d; if (k < 0 || k > 2) return; [o[j], o[k]] = [o[k], o[j]];
    wbSave({ order: o, widths: L.widths }); layoutPanes(sec, panes); const b = sec.querySelector(`[data-pane="${id}"] .panebar .ib`); if (b) b.focus(); };
  return h("div", { class: "panebar" }, h("h2", {}, title),
    h("button", { class: "ib", type: "button", "aria-label": `Move ${id} pane left`, title: "Move left", onclick: () => mv(-1) }, "◀"),
    h("button", { class: "ib", type: "button", "aria-label": `Move ${id} pane right`, title: "Move right", onclick: () => mv(1) }, "▶"));
}

/* 📸 the browser asks which tab to share; we grab one frame and crop it to the preview */
async function capture(frame, pid, note, lane) {
  const out = note || $("#pvcapnote");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    out.textContent = "📸 Use the phone's own screenshot here — capture needs a desktop browser."; return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" }, audio: false,
      preferCurrentTab: true, selfBrowserSurface: "include" });
  } catch (e) { out.textContent = "📸 Capture cancelled."; return; }
  try {
    const v = h("video", { muted: true, playsinline: true }); v.srcObject = stream; await v.play();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const b = frame.getBoundingClientRect(), sx = v.videoWidth / innerWidth, sy = v.videoHeight / innerHeight;
    const c = h("canvas", { width: Math.round(b.width * sx), height: Math.round(b.height * sy) });
    c.getContext("2d").drawImage(v, b.left * sx, b.top * sy, b.width * sx, b.height * sy, 0, 0, c.width, c.height);
    const png = c.toDataURL("image/png");
    const a = h("a", { href: png, download: `preview-${pid}-${Date.now()}.png` }); a.click();
    const r = lane ? await api("/api/compare/capture", { project: pid, id: lane.id, lane: lane.k, png })
                   : await api("/api/preview/capture", { project: pid, png });
    out.textContent = r.ok ? `📸 saved ${r.file || "for this model"}` : `📸 downloaded · ⚠️ ${r.message || "not kept in the project"}`;
  } finally { stream.getTracks().forEach(t => t.stop()); }
}

/* ---------- 🪞 Show & change (flag `live`, 2026-11-23) ----------

      if (chk && chk.new != null && chk.new >= 400 && !(chk.now >= 400)) { l = "red"; why.push(`The New page did not open (the app answered ${chk.new}).`); }

      return;
    }
    if (d.type === "loaded" || d.type === "errors" || d.type === "moved")
      seen[side] = { errors: d.errors || [], blocked: d.blocked || [], loaded: d.type === "loaded" || !!(seen[side] && seen[side].loaded) };

/* ---------- ⚖️ Compare (flag `compare`, M8) ---------- */
let cmpTimer = null;
const modelCache = {};
function modelsFor(prov, pid) {
  const k = prov + "|" + pid;
  if (!modelCache[k]) modelCache[k] = api(`/api/models?provider=${encodeURIComponent(prov)}&project=${encodeURIComponent(pid)}`);
  return modelCache[k];
}
function compareView() {
  if (!S.flags.compare) return [offCard("compare", "⚖️", "Compare models")];
  if (!S.flags.agent) return [h("div", { class: "offcard", role: "status" }, h("div", { class: "big" }, "⏸"),
    h("h2", {}, "⚖️ Compare needs 🤖 Agent switched on first"), h("p", {}, "Each model runs the agent loop. Nothing is sent and nothing is spent."))];
  const p = curProject();
  const provs = S.providers.filter(x => !p.sensitive || x.local);
  let lanes = store.get("cmplanes." + p.id, null) || [{ provider: provs[0].id, model: "" }, { provider: provs[0].id, model: "" }];
  const laneBox = h("div", { class: "lanes", id: "cmplanes" });
  function saveLanes() { store.set("cmplanes." + p.id, lanes); }
  function paintLanes() {
    laneBox.innerHTML = "";
    lanes.forEach((ln, i) => {
      if (!provs.some(x => x.id === ln.provider)) ln.provider = provs[0].id;
      const ms = h("select", { "aria-label": `Model ${i + 1}`, onchange: e => { ln.model = e.target.value; saveLanes(); } }, h("option", {}, "⏳"));
      const ps = h("select", { "aria-label": `Provider ${i + 1}`, onchange: e => { ln.provider = e.target.value; ln.model = ""; saveLanes(); paintLanes(); } },
        provs.map(x => h("option", { value: x.id, selected: x.id === ln.provider }, `${x.icon} ${x.id}`)));
      modelsFor(ln.provider, p.id).then(r => {
        ms.innerHTML = "";
        if (!r.ok) { ms.append(h("option", { value: "" }, `${r.icon || "⚠️"} ${r.message || "no models"}`)); return; }
        if (!ln.model || !r.models.includes(ln.model)) { ln.model = r.models[0] || ""; saveLanes(); }
        r.models.forEach(m => ms.append(h("option", { value: m, selected: m === ln.model }, mlabel(r, m))));
      });
      laneBox.append(h("div", { class: "lanerow" }, h("b", {}, `${i + 1}`), ps, ms,
        lanes.length > 2 ? h("button", { class: "ib", title: "Remove", "aria-label": `Remove model ${i + 1}`,
          onclick: () => { lanes.splice(i, 1); saveLanes(); paintLanes(); } }, "✕") : null));
    });
    addBtn.hidden = lanes.length >= 4;
  }
  const addBtn = h("button", { class: "btn", id: "cmpadd", onclick: () => { lanes.push({ provider: provs[0].id, model: "" }); saveLanes(); paintLanes(); } }, "➕ Add a model");
  const task = h("textarea", { id: "cmptask", "aria-label": "Task", placeholder: "⚖️ The task every model gets, e.g. Add a footer with today's year." });
  const checks = h("textarea", { id: "cmpchecks", "aria-label": "Checks", style: "min-height:60px",
    placeholder: "🧪 Checks, one per line (optional) — e.g. grep -q footer index.html" });
  task.value = store.get("cmptask." + p.id, ""); checks.value = store.get("cmpchecks." + p.id, "");
  let t = null;
  const keep = () => { store.set("cmptask." + p.id, task.value); store.set("cmpchecks." + p.id, checks.value); clearTimeout(t);
    t = setTimeout(() => api("/api/autosave", { project: p.id, field: "compare-task", text: task.value + "\n---checks---\n" + checks.value }), 700); };
  task.oninput = keep; checks.oninput = keep;
  const startBtn = h("button", { class: "btn pri", id: "cmpstart" }, "▶ Compare");
  const stopBtn = h("button", { class: "btn", id: "cmpstop", disabled: true }, "⏹ Stop");
  const status = h("span", { class: "note", id: "cmpstatus", role: "status" });
  const final = h("div", { class: "final", id: "cmpfinal", hidden: true });
  const grid = h("div", { class: "cmpgrid", id: "cmpgrid", "aria-live": "polite" });
  const after = h("div", { id: "cmpafter", hidden: true });
  const hist = h("div", { id: "cmphist" });

  function paint(c) {
    const running = c.state === "running";
    status.textContent = `${STATE[c.state] || c.state} · $${c.usd.toFixed(4)} / $${c.cap_usd.toFixed(2)} (≤ $${c.lane_cap_usd.toFixed(2)} per model)`;
    startBtn.disabled = running; stopBtn.disabled = !running;
    final.hidden = running || !c.why; final.textContent = c.why || "";
    const n = c.checks.length;
    const best = c.lanes.filter(l => l.state !== "waiting" && l.state !== "skipped")
      .sort((a, b) => (b.passed - a.passed) || (a.usd - b.usd))[0];
    grid.innerHTML = "";
    c.lanes.forEach(l => {
      const note = h("span", { class: "note" });
      const card = h("article", { class: "lanecard" + (!running && best && n && best.k === l.k ? " best" : ""), "data-lane": l.k },
        h("h3", {}, `${l.provider} · ${l.model}`),
        h("div", { class: "m" }, h("span", {}, STATE[l.state] || l.state), !running && best && n && best.k === l.k ? h("b", {}, "🏅 best") : null),
        h("div", { class: "m" }, h("span", {}, "⏱ Time"), h("span", {}, l.secs == null ? "—" : `${l.secs} s`)),
        h("div", { class: "m" }, h("span", {}, "💲 Cost"), h("span", {}, `$${l.usd.toFixed(4)}`)),
        h("div", { class: "m" }, h("span", {}, "🔤 Tokens"), h("span", {}, `${l.tokens_in} in · ${l.tokens_out} out`)),
        h("div", { class: "m" }, h("span", {}, "👣 Steps"), h("span", {}, String(l.steps))),
        h("div", { class: "m" }, h("span", {}, "🧪 Checks"), h("span", {}, n ? `${l.passed}/${n} passed` : "none set")),
        l.checks.length ? h("details", {}, h("summary", {}, "check results"),
          l.checks.map(x => h("div", {}, `${x.ok ? "✅" : "❌"} ${x.cmd}`))) : null,
        l.why ? h("details", {}, h("summary", {}, "ℹ️ how it ended"), h("p", {}, l.why)) : null);
      if (!running && l.state !== "waiting" && l.state !== "skipped") {
        const fr = h("iframe", { sandbox: "allow-scripts allow-forms allow-modals", referrerpolicy: "no-referrer", title: `Result of ${l.model}`, src: `/compare-page/${p.id}/${c.id}/lanes/${l.k}/index.html` });
        card.append(fr, h("div", { class: "runbar" },
          h("button", { class: "ib", title: "Screen capture", "aria-label": `Screen capture of ${l.model}`,
            onclick: () => capture(fr, p.id, note, { id: c.id, k: l.k }) }, l.shot ? "📸✓" : "📸"), note));
      }
      grid.append(card);
    });
    after.hidden = running || c.state === "failed";
    if (running) { clearTimeout(cmpTimer); cmpTimer = setTimeout(poll, 1500); }
    else loadHist();
  }
  async function poll() {
    const id = store.get("cmp." + p.id, null); if (!id || view !== "compare") return;
    const r = await api(`/api/compare?project=${encodeURIComponent(p.id)}&id=${encodeURIComponent(id)}`);
    if (!r.ok) { store.set("cmp." + p.id, null); status.textContent = ""; return; }
    if (r.spend) { S.spend = r.spend; paintBar(); }
    paint(r.comparison); paintAfter(r.comparison);
  }
  function paintAfter(c) {
    after.innerHTML = "";
    const title = h("input", { type: "text", id: "cmptitle", maxlength: 80, placeholder: "Title for Review", "aria-label": "Title" });
    const wu = h("textarea", { id: "cmpwu", "aria-label": "Write-up", placeholder: "📝 What you compared and what you learned." });
    title.value = store.get("cmptitle." + c.id, ""); wu.value = store.get("cmpwu." + c.id, "");
    title.oninput = () => store.set("cmptitle." + c.id, title.value);
    wu.oninput = () => store.set("cmpwu." + c.id, wu.value);
    const out = h("span", { class: "note", role: "status" });
    const send = h("button", { class: "btn pri", id: "cmpsend" }, "📋 Send to Review");
    send.onclick = async () => {
      send.disabled = true;
      const r = await api("/api/compare/review", { project: p.id, id: c.id, title: title.value, writeup: wu.value });
      send.disabled = false;
      out.textContent = r.ok ? (r.where === "hermes" ? "📋 Sent — waiting for your OK in Hermes." : "🏝 Kept here (standalone).")
        : `${r.icon || "⚠️"} ${r.message || "Not sent."}`;
    };
    after.append(h("div", { class: "runbar" },
      h("a", { class: "btn", href: `/compare-page/${p.id}/${c.id}/`, target: "_blank", rel: "noopener" }, "📄 Open saved page")),
      h("details", { class: "cmpform" }, h("summary", {}, "📋 Send to Review as a portfolio piece"), title, wu,
        h("div", { class: "runbar" }, send, out)));
  }
  async function loadHist() {
    const r = await api(`/api/compare?project=${encodeURIComponent(p.id)}`);
    hist.innerHTML = "";
    if (!r.ok || !r.items.length) return;
    hist.append(h("details", {}, h("summary", {}, `🗂 Past comparisons (${r.items.length})`),
      r.items.map(it => h("button", { class: "btn", style: "display:block;width:100%;text-align:left;margin-top:6px",
        onclick: () => { store.set("cmp." + p.id, it.id); poll(); } },
        `${STATE[it.state] || it.state} · ${it.models.length} models · $${(it.usd || 0).toFixed(4)} · ${it.task}`))));
  }
  startBtn.onclick = async () => {
    if (!task.value.trim()) { status.textContent = "✏️ Write the task first."; return; }
    startBtn.disabled = true;
    const r = await api("/api/compare/start", { project: p.id, task: task.value, lanes,
      checks: checks.value.split("\n").map(x => x.trim()).filter(Boolean) });
    if (!r.ok) { startBtn.disabled = false; status.textContent = `${r.icon || "⚠️"} ${r.message || "Didn't start."}`; return; }
    store.set("cmp." + p.id, r.comparison.id); paint(r.comparison);
  };
  stopBtn.onclick = async () => {
    const id = store.get("cmp." + p.id, null); if (!id) return;
    stopBtn.disabled = true; const r = await api("/api/compare/stop", { id }); if (r.ok) paint(r.comparison);
  };
  paintLanes();
  if (store.get("cmp." + p.id, null)) poll(); else loadHist();
  return [projectRow(), h("section", { class: "agent", id: "compare" },
    task, laneBox, h("div", { class: "runbar" }, addBtn), checks,
    h("div", { class: "runbar" }, startBtn, stopBtn), status, final, grid, after, hist,
    h("details", {}, h("summary", {}, "ℹ️ Limits"),
      h("p", {}, "Each model gets its own copy of the project and runs in the sandbox (no internet), one after another. One $ cap for the whole comparison, split evenly, inside the daily cap. ⏹ Stop ends the current model and skips the rest.")))];
}

/* ---------- 📋 Review (M6): demos → Hermes; held writes → Apply / Reject ---------- */
const RSTATE = { waiting: "✋ waiting for Scott", approved: "✓ approved (dry run)", published: "🌐 published",
                 rejected: "✗ rejected", kept: "🏝 kept here" };
function reviewView() {
  const p = curProject();
  const box = h("section", { class: "agent", id: "review" });
  const title = h("input", { type: "text", id: "rvtitle", maxlength: 80, placeholder: "Demo title", "aria-label": "Demo title",
    style: "width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel)" });
  const wu = h("textarea", { id: "rvwriteup", "aria-label": "Write-up", placeholder: "📝 What it is, what the model did, how you checked it." });
  const models = h("input", { type: "text", id: "rvmodels", "aria-label": "Models used", placeholder: "Models used (comma separated)",
    style: "width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel)" });
  title.value = store.get("rvtitle." + p.id, ""); wu.value = store.get("rvwu." + p.id, "");
  let t = null;
  const keep = () => { store.set("rvtitle." + p.id, title.value); store.set("rvwu." + p.id, wu.value); clearTimeout(t);
    t = setTimeout(() => api("/api/autosave", { project: p.id, field: "review-writeup", text: title.value + "\n\n" + wu.value }), 700); };
  title.oninput = keep; wu.oninput = keep;
  const capNote = h("p", { class: "note", id: "rvcap" }, "⏳");
  const sendBtn = h("button", { class: "btn pri", id: "rvsend" }, S.mode === "connected" ? "📤 Send to Hermes Review" : "💾 Keep for Review");
  const out = h("p", { class: "note", id: "rvout", role: "status" });
  const sentBox = h("div", { class: "steps", id: "rvsent" });
  const heldBox = h("div", { class: "steps", id: "rvheld" });
  sendBtn.onclick = async () => {
    sendBtn.disabled = true; out.textContent = "⏳";
    const ms = models.value.split(",").map(x => x.trim()).filter(Boolean);
    const r = await api("/api/review/send", { project: p.id, title: title.value, writeup: wu.value, models: ms });
    sendBtn.disabled = false;
    out.textContent = r.ok ? (r.where === "hermes" ? "📤 Sent — it waits in Hermes 📋 Review for Scott's OK." : "💾 " + r.note)
      : `${r.icon || "⚠️"} ${r.message || "Not sent."}`;
    if (r.ok) load();
  };
  async function load() {
    const r = await api(`/api/review?project=${encodeURIComponent(p.id)}`);
    if (!r.ok) { out.textContent = `${r.icon || "⚠️"} ${r.message || "Couldn't load Review."}`; return; }
    if (!models.value && r.project) models.value = (r.project.models || []).join(", ");
    capNote.textContent = r.project && r.project.capture ? `📸 Screenshot: ${r.project.capture} (the latest capture)`
      : "📸 No capture yet — take one in 👁 Live preview (desktop), or send without a screenshot.";
    sentBox.innerHTML = "";
    if (!r.sent.length) sentBox.append(h("p", { class: "note" }, "Nothing sent yet."));
    r.sent.forEach(x => sentBox.append(h("div", { class: "step" },
      h("div", { class: "hd" }, h("b", {}, x.title), h("span", { class: "chip" }, RSTATE[x.state] || x.state)),
      h("div", { class: "why" }, `${x.project} · ${new Date(x.at * 1000).toLocaleString()} · ${(x.models || []).join(", ") || "models not recorded"}`),
      x.url ? h("div", { class: "why" }, "→ " + x.url) : null, x.why ? h("div", { class: "why" }, x.why) : null,
      x.note ? h("div", { class: "why" }, x.note) : null)));
    heldBox.innerHTML = "";
    if (!r.held.length) heldBox.append(h("p", { class: "note" }, "No held writes."));
    r.held.forEach(x => {
      const cf = h("input", { type: "text", "aria-label": "Type apply", placeholder: "type apply",
        style: "padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);max-width:9rem" });
      const note = h("span", { class: "note" });
      const ok = h("button", { class: "btn pri", onclick: async () => {
        const a = await api("/api/review/apply", { id: x.id, sha: x.sha, confirm: cf.value });
        note.textContent = a.ok ? `✅ written${a.backup ? " (old copy kept)" : ""}` : `${a.icon || "⚠️"} ${a.message}`;
        if (a.ok) setTimeout(load, 900);
      } }, "✅ Apply");
      const no = h("button", { class: "btn", onclick: async () => {
        const a = await api("/api/review/reject", { id: x.id });
        note.textContent = a.ok ? "✗ rejected (kept, not deleted)" : `⚠️ ${a.message}`; if (a.ok) setTimeout(load, 900);
      } }, "✗ Reject");
      heldBox.append(h("div", { class: "step held" },
        h("div", { class: "hd" }, h("span", { "aria-hidden": "true" }, "✋"), h("b", {}, x.target)),
        h("div", { class: "why" }, `From the agent in ${x.project} · ${x.bytes} bytes · outside the project folder`),
        h("details", {}, h("summary", {}, "what would be written"), h("pre", {}, x.preview)),
        h("div", { class: "runbar" }, cf, ok, no, note)));
    });
  }
  load();
  box.append(...[
    h("h2", { style: "margin:4px 0" }, "📤 Send a demo"),
    p.sensitive ? h("p", { class: "warnbox" }, "🔒 This project is sensitive — it can't go to Review.") : null,
    title, wu, models, capNote, h("div", { class: "runbar" }, sendBtn), out,
    h("details", {}, h("summary", {}, "ℹ️ What happens"),
      h("p", {}, S.mode === "connected"
        ? "Hermes holds it in 📋 Review. Scott approves with his owner PIN on the 🧪 AI Lab card. Approve runs a dry run unless he types publish; then it goes to scottchristensen.dev/lab/…"
        : "Standalone: the demo is kept on this computer. Publishing only happens through Hermes Review (connected mode).")),
    h("h2", { style: "margin:10px 0 4px" }, "📨 Sent"), sentBox,
    h("h2", { style: "margin:10px 0 4px" }, "✋ Held agent writes"), heldBox].filter(Boolean));
  return [projectRow(), box];
}

function render() {
  const main = $("#main"); main.innerHTML = "";
  clearInterval(pvTimer); pvTimer = null; pvPoll = null; clearTimeout(agTimer); clearTimeout(cmpTimer);
  clearTimeout(liveTimer); if (liveMsg) { removeEventListener("message", liveMsg); liveMsg = null; }
  main.classList.toggle("wide", view === "start" || view === "live" || (view === "preview" && !!S.flags.preview));
  paintProjects();
  const path = PATHS.find(p => p.id === view);
  let kids;
  if (view === "start") kids = startView();
  else if (view === "chat") kids = chatView();
  else if (view === "preview") kids = previewView();
  else if (view === "agent") kids = agentView();
  else if (view === "review") kids = reviewView();
  else if (view === "compare") kids = compareView();
  else if (view === "live") kids = liveView();
  else if (view === "settings") kids = settingsView();
  else if (view === "memory") kids = memoryView();
  else if (view === "prompt") kids = promptView();
  else kids = [offCard(path.flag, path.sym, path.name, path.later)];
  main.append(...kids);
  $("#back").disabled = false;
  store.set("view", view);
}

(async function boot() {
  const r = await api("/api/state");
  if (!r.ok) { $("#main").innerHTML = ""; $("#main").append(h("div", { class: "offcard" }, h("div", { class: "big" }, "🔌"), h("h2", {}, "The Lab server isn't answering."))); return; }
  S = r; paintBar();
  /* always opens on the 🛠 workbench, in the last project (2026-11-22) */
  render();
})();
</script>
</body>
</html>
