<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🧪 AI Lab</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
  // Theme before first paint (dark by default) — no flash of the wrong mode.
  try { var t = localStorage.getItem('ailab.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root { --r: 14px; --gap: 12px; font-size: 17px; }
  [data-theme="dark"] {
    --bg: #0d1520; --panel: #142133; --panel2: #1b2b40; --line: #2a3d57;
    --text: #e8dfc8; --dim: #a9a08c; --accent: #c9a54a; --accent-ink: #1a1408;
    --calm: #26394f; --ok: #6f9c7a; --warn: #b89558; --bad: #b97a6c; --me: #223a55;
  }
  [data-theme="light"] {
    --bg: #f5f2ec; --panel: #fbf9f4; --panel2: #ece6da; --line: #d6cdbb;
    --text: #1d2a3a; --dim: #5d6672; --accent: #8a6a1f; --accent-ink: #fff8e6;
    --calm: #e3ebf2; --ok: #4f7a5a; --warn: #8a6a2c; --bad: #8f5446; --me: #dfe8f1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* slim top bar: ← ⌂ left, title, chips right */
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 48px; }
  .ib { background: none; border: 0; border-radius: 10px; min-width: 40px; height: 40px; font-size: 1.15rem; }
  .ib:hover, .ib:focus-visible { background: var(--panel2); outline: none; }
  .title { font-weight: 650; font-size: 1rem; white-space: nowrap; }
  .chips { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
  .chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line); font-size: .85rem; white-space: nowrap; }
  .spend .bar { width: 46px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .spend .bar i { display: block; height: 100%; background: var(--ok); width: 0; }

  main { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 1100px; margin: 0 auto; padding: var(--gap); gap: var(--gap); }
  .loading { margin: 25vh auto; font-size: 2rem; opacity: .6; }

  /* start: project row + path cards */
  .proj { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
  .proj select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 10rem; }
  .lock { font-size: .85rem; color: var(--dim); }
  .paths { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--gap); }
  .path { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
  .path:hover, .path:focus-visible { border-color: var(--accent); outline: none; }
  .path .sym { font-size: 2rem; line-height: 1; }
  .path .name { font-weight: 650; }
  .path .st { font-size: .8rem; color: var(--dim); margin-top: auto; }
  .path.off { opacity: .78; }
  .path.off .sym { filter: grayscale(.6); }

  /* calm "not switched on" card */
  .offcard { margin: 6vh auto 0; max-width: 520px; text-align: center; background: var(--calm);
    border: 1px solid var(--line); border-radius: var(--r); padding: 22px 18px; }
  .offcard .big { font-size: 2.6rem; }
  .offcard h2 { margin: 8px 0 4px; font-size: 1.15rem; }
  .offcard p { margin: 6px 0; color: var(--dim); }
  details { text-align: left; margin-top: 10px; }
  summary { cursor: pointer; color: var(--dim); }

  /* chat */
  .chat { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .picker { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .picker select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; max-width: 100%; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; min-height: 30vh; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--me); }
  .msg .meta { display: block; margin-top: 6px; font-size: .78rem; color: var(--dim); }
  .msg.err { border-color: var(--warn); }
  .composer { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: 0; background: var(--bg); padding-top: 6px; }
  .composer textarea { flex: 1; min-height: 52px; max-height: 40vh; resize: vertical; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; }
  .send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r); height: 52px; min-width: 56px; font-size: 1.3rem; }
  .send:disabled { opacity: .5; cursor: default; }
  .saved { font-size: .78rem; color: var(--dim); min-height: 1em; }

  dialog { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); color: var(--text); max-width: 92vw; }
  dialog { padding: 0; } dialog > form { padding: 16px; }   /* padding on the form, so a tap inside the box never counts as "outside" */
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog input[type=text] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  /* ⚙️ Settings → 🔑 Keys (2026-11-23) */
  .hint { margin: 6px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--calm, var(--panel2)); font-size: .95rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .legend { font-size: .9rem; color: var(--dim); flex-basis: 100%; } .legend summary { cursor: pointer; }
  .keys { max-width: 760px; margin: 0 auto; }
  .keyrow { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 2fr) auto; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); margin: 10px 0; background: var(--panel); }
  .keyrow .st { font-size: .92rem; color: var(--dim); }
  .keyrow input { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: inherit; padding: 8px 10px; font: inherit; }
  .keyrow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .keyrow .btn { min-height: 44px; }
  .keyrow .msg { grid-column: 1 / -1; font-size: .92rem; min-height: 1.2em; }
  @media (max-width: 640px) { .keyrow { grid-template-columns: 1fr; } .keyrow .acts { justify-content: flex-start; } }
  .btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px 14px; }
  a.btn { color: inherit; text-decoration: none; display: inline-block; }
  .btn.pri { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  @media (max-width: 640px) {
    :root { --gap: 10px; }
    .title .full { display: none; }
    .chip .lbl, .spend .bar { display: none; }
    header { gap: 2px; padding: 6px 6px; }
    .ib { min-width: 36px; }
    .chips { gap: 4px; }
    .chip { padding: 4px 8px; }
    .msg { max-width: 94%; }
  }
  /* live preview: code ↔ steady preview */
  main.wide { max-width: none; }
  .split { height: calc(100dvh - 150px); min-height: 420px; display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 1.2fr); gap: var(--gap); min-height: 0; }
  .pane { display: flex; flex-direction: column; gap: 8px; min-height: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
  .bar2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 6px 10px; font-size: .9rem; }
  .tab[aria-pressed="true"] { border-color: var(--accent); font-weight: 650; }
  .tab .dot { color: var(--warn); }
  .code { flex: 1; min-height: 40vh; width: 100%; resize: vertical; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); padding: 10px; font: 15px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; tab-size: 2; }
  .pvpane { min-height: 0; }
  .pane a.ib { color: inherit; display: inline-grid; place-items: center; text-decoration: none; }
  .frame { flex: 1; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-height: 0; }
  .note { font-size: .82rem; color: var(--dim); min-height: 1.2em; }
  #pvsave { margin-left: auto; }
  .warnbox { background: var(--calm); border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; height: auto; }
    .pvpane { order: -1; position: sticky; top: 52px; height: 46dvh; z-index: 2; }   /* preview stays in view above the code */
    .code { min-height: 34vh; }
  }
  /* agent */
  .agent { display: flex; flex-direction: column; gap: 10px; }
  .agent textarea { width: 100%; min-height: 90px; resize: vertical; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--panel); padding: 10px; }
  .runbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; }
  .step .hd { display: flex; gap: 8px; align-items: baseline; }
  .step .n { color: var(--dim); font-size: .8rem; min-width: 1.6em; }
  .step .why { color: var(--dim); font-size: .9rem; }
  .step pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font-size: .82rem; max-height: 40vh; overflow: auto; }
  .step.held { border-color: var(--warn); }
  .step .hd b { flex-shrink: 0; }
  .step .hd > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  .step.err { border-color: var(--bad); }
  .final { background: var(--calm); border-radius: var(--r); padding: 10px 12px; }
  /* ⚖️ Compare (M8) */
  .lanes { display: flex; flex-direction: column; gap: 8px; }
  .lanerow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; }
  .lanerow select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; max-width: 100%; flex: 1 1 150px; }
  .cmpgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .lanecard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .lanecard h3 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
  .lanecard .m { display: flex; justify-content: space-between; gap: 8px; }
  .lanecard iframe { width: 100%; height: 240px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .lanecard.best { border-color: var(--accent); }
  .cmpform input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
  /* 🛠 workbench (2026-11-22): the Lab's front page — Files · Code · Agent, changes first */
  [hidden] { display: none !important; }
  header .projsel { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; min-width: 6.5rem; max-width: 40vw; flex: 0 1 15rem; }
  header #waiting { border-color: var(--warn); }
  .wbtabs { display: none; gap: 6px; }
  .wbtabs .tab { flex: 1; padding: 10px 6px; font-size: 1rem; }
  .wb { flex: 1; display: grid; grid-template-columns: minmax(170px, 230px) minmax(0, 1.35fr) minmax(320px, 1fr); gap: var(--gap);
    height: calc(100dvh - 48px - 2 * var(--gap)); min-height: 0; }
  /* 2026-11-23: panes can be resized (drag the gutter, or focus it and use ← →) and moved (◀ ▶ in each pane bar) */
  .wb.custom { gap: 0; }
  .gutter { width: 12px; cursor: col-resize; touch-action: none; -webkit-user-select: none; user-select: none; border: 0; background: transparent; padding: 0;
    position: relative; align-self: stretch; }
  .gutter::after { content: ""; position: absolute; left: 4px; right: 4px; top: 0; bottom: 0; border-radius: 4px; background: var(--line); }
  .gutter:hover::after, .gutter:focus-visible::after { background: var(--accent); }
  .panebar { display: flex; align-items: center; gap: 4px; }
  .panebar h2 { flex: 1; }
  /* 2026-11-23 clarity pass: one plain line under each pane title; ⤢ enlarge for the big text boxes */
  .panesub { margin: -2px 0 6px; font-size: .92rem; color: var(--dim); }
  .boxwrap { position: relative; display: flex; flex-direction: column; min-height: 0; }
  .boxwrap > textarea { flex: 1; resize: vertical; padding-right: 48px; }
  .boxwrap > .grow { position: absolute; top: 6px; right: 6px; z-index: 2; min-width: 40px; min-height: 40px; }
  .boxwrap.big { position: fixed; inset: 4vh 4vw; z-index: 60; background: var(--panel); border: 2px solid var(--accent); border-radius: var(--r);
    padding: 12px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
  .boxwrap.big > textarea { height: 100% !important; min-height: 0 !important; max-height: none; resize: none; font-size: 1.05rem; }
  .filesed > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; font-weight: 650; }
  .filesed[open] { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
  .waitnone { color: var(--dim); font-size: .95rem; margin: 4px 0 10px; }
  .panebar .ib { min-width: 36px; min-height: 36px; opacity: .7; }
  .panebar .ib:hover, .panebar .ib:focus-visible { opacity: 1; }
  .wb > .pane { overflow: auto; min-width: 0; }
  .wb select, .wb textarea { max-width: 100%; min-width: 0; }
  .wb h2 { margin: 0; font-size: 1rem; }
  .wbfiles #pvtabs { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
  .wbfiles .tab { text-align: left; overflow-wrap: anywhere; }
  .wbcode .code { min-height: 200px; }
  .wbcode .frame { min-height: 300px; }
  .wbfile { font-weight: 650; overflow-wrap: anywhere; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-left: auto; }
  .seg button { border: 0; background: var(--panel2); padding: 7px 12px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .wbcode #pvsave { margin-left: 0; }
  .wbagent textarea { min-height: 110px; }
  .wbagent .step { background: var(--bg); }
  .changes { display: flex; flex-direction: column; gap: 8px; }
  .changes:empty { display: none; }
  .chg { border: 1px solid var(--warn); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
  .chg .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .chg .hd b { overflow-wrap: anywhere; }
  .diff { margin: 6px 0; padding: 8px; border-radius: 8px; background: var(--panel2); font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 38vh; overflow: auto; }
  .diff .add { color: var(--ok); } .diff .del { color: var(--bad); } .diff .hunk { color: var(--dim); }
  .chg input { padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); max-width: 9rem; }
  .drawer { margin-top: 0; border-top: 1px solid var(--line); padding-top: 6px; }
  .drawer pre { white-space: pre-wrap; word-break: break-word; font-size: .82rem; max-height: 30vh; overflow: auto; margin: 6px 0 0; }
  .wbtools .btn.off { opacity: .6; }
  @media (max-width: 980px) {
    .title { display: none; }
    .wbtabs { display: flex; position: sticky; top: 52px; z-index: 3; background: var(--bg); padding-bottom: 2px; }
    .wb, .wb.custom { grid-template-columns: minmax(0, 1fr) !important; height: auto; }
    .wb > .pane { display: none; overflow: visible; }
    .gutter, .panebar .ib { display: none; }
    header #full, header #mode { display: none; }
  }
  @media (max-width: 640px) {
    header #projnew { display: none; }                      /* phone: "➕ New project…" is the last entry of the project list */
    header .projsel { min-width: 5.5rem; flex: 1 1 5.5rem; max-width: none; }
    .wb[data-tab="files"] > .wbfiles, .wb[data-tab="code"] > .wbcode, .wb[data-tab="agent"] > .wbagent { display: flex; }
    .wbcode .code { min-height: 46vh; }
    .wbcode .frame { min-height: 56vh; }
  }
  #navnote { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(92vw, 520px); padding: 12px 16px; border-radius: 12px; background: var(--panel); color: var(--ink, inherit); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.35); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #navnote.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <button class="ib" id="back" title="Back" aria-label="Back">←</button>
  <button class="ib" id="home" title="Home" aria-label="Home">⌂</button>
  <span class="title">🧪 <span class="full">AI Lab</span></span>
  <label class="sr" for="projsel">Project</label>
  <select class="projsel" id="projsel" title="Project"></select>
  <button class="ib" id="projnew" title="New project" aria-label="New project">➕</button>
  <button class="chip" id="waiting" title="Changes waiting for your OK" hidden></button>
  <span class="chips">
    <span class="chip" id="mode" title="Mode"></span>
    <span class="chip spend" id="spend" title="Spent today / daily cap"><span>💲</span><span id="spendtxt">–</span><span class="bar"><i id="spendbar"></i></span></span>
    <button class="ib" id="full" title="Full screen" aria-label="Full screen">⛶</button>
    <button class="ib" id="settings" title="Settings — keys" aria-label="Settings">⚙️</button>
    <button class="ib" id="theme" title="Light / dark" aria-label="Light or dark mode">☀️</button>
  </span>
</header>
<main id="main" aria-live="polite"><div class="loading" aria-label="Loading">⏳</div></main>

<dialog id="newproj">
  <form method="dialog">
    <h3 style="margin-top:0">➕ New project</h3>
    <label class="sr" for="pname">Name</label>
    <input type="text" id="pname" placeholder="Name" maxlength="60" required>
    <p><label><input type="checkbox" id="psens"> 🔒 Sensitive — stays on this computer (Ollama only)</label></p>
    <div class="row"><button class="btn" value="cancel" formnovalidate aria-label="Close">✕</button><button class="btn pri" value="ok" id="pok">✓ Create</button></div>
  </form>
</dialog>

<script>
"use strict";
const $ = (s, el) => (el || document).querySelector(s);
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem("ailab." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ailab." + k, JSON.stringify(v)); } catch (e) {} },
};
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  let j = {}; try { j = await r.json(); } catch (e) {}
  j.status = r.status; return j;
}

const PATHS = [
  { id: "chat", flag: "router", sym: "💬", name: "Ask models", tip: "Pick a model, ask, see the cost of every answer." },
  { id: "preview", flag: "preview", sym: "👁", name: "Live preview", tip: "Code on one side, the running page on the other." },
  { id: "agent", flag: "agent", sym: "🤖", name: "Agent", tip: "Plan → write → run → check, step by step, with a Stop button." },
  { id: "review", flag: null, sym: "📋", name: "Review", tip: "Send a demo to Hermes for your OK; apply or reject held agent writes." },
  { id: "compare", flag: "compare", sym: "⚖️", name: "Compare models", tip: "Same task, 2–4 models, side by side." },
];
let S = null;                          // server state
let view = "start", trail = [];        // ← retraces this trail
let chatLog = [];

/* ---------- top bar ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("ailab.theme", t); } catch (e) {}
  $("#theme").textContent = t === "dark" ? "☀️" : "🌙";
}
$("#settings").onclick = () => go("settings");
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("#theme").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";

/* ⤢ Enlarge (2026-11-23): wraps a textarea; the button (or Esc) toggles a near-full-screen view. Typing is never lost —

function growBox(ta, label) {
  const wrap = h("div", { class: "boxwrap" });

  const set = (on) => { wrap.classList.toggle("big", on); btn.textContent = on ? "⤡" : "⤢"; btn.setAttribute("aria-pressed", String(on));

/* 🧱 Pane layout (2026-11-23): order + widths live on this device (store "wblayout"); the code pane is the flexible one.
   Gutters are real buttons: drag with pointer capture, or focus and use ← → (16px a step). ◀ ▶ swap a pane with its neighbour. */
const PANES = ["files", "code", "agent"], PANE_MIN = { files: 150, code: 280, agent: 300 };
function wbLayout() { const l = store.get("wblayout", null); return l && Array.isArray(l.order) && l.order.length === 3 && PANES.every(x => l.order.includes(x)) ? { order: l.order, widths: l.widths || {} } : { order: [...PANES], widths: {} }; }
function wbSave(l) { store.set("wblayout", l); }
function wbResetLayout() { store.set("wblayout", null); render(); }
function layoutPanes(sec, panes) {
  const l = wbLayout();
  sec.classList.add("custom");               // 2026-11-23: gutters are grid cells too — always lay out all 5 columns (first launch wrapped)
  sec.replaceChildren();
  const cols = [];
  l.order.forEach((id, i) => {
    if (i) { sec.append(gutter(l.order[i - 1], id)); cols.push("12px"); }
    sec.append(panes[id]);
    cols.push(id === "code" ? "minmax(0, 1fr)" : l.widths[id] ? `${l.widths[id]}px` : (id === "files" ? "minmax(170px, 230px)" : "minmax(320px, 1fr)"));
  });
  sec.style.gridTemplateColumns = cols.join(" ");
  function gutter(a, b) {
    const target = a !== "code" ? a : b, sign = a !== "code" ? 1 : -1;   // the side pane this gutter resizes, and which way grows it
    const g = h("button", { class: "gutter", type: "button", role: "separator", "aria-orientation": "vertical",
      "aria-label": `Resize ${target} pane. Drag, or use the left and right arrow keys.` });
    const cur = () => l.widths[target] || panes[target].getBoundingClientRect().width;
    const clamp = (w) => Math.round(Math.max(PANE_MIN[target], Math.min(w, sec.clientWidth - 24 - PANE_MIN.code - 150)));
    const apply = (w) => { l.widths[target] = clamp(w); wbSave(l); layoutPanes(sec, panes); };
    let x0 = 0, w0 = 0, live = null;
    g.addEventListener("pointerdown", e => { if (e.button !== 0) return; x0 = e.clientX; w0 = cur(); live = w0; g.setPointerCapture(e.pointerId); e.preventDefault(); });
    g.addEventListener("pointermove", e => { if (!g.hasPointerCapture(e.pointerId)) return; live = clamp(w0 + sign * (e.clientX - x0));
      const c = [...cols]; c[l.order.indexOf(target) * 2] = `${live}px`; sec.style.gridTemplateColumns = c.join(" "); });   // cols, not a split string: "minmax(0, 1fr)" holds a space
    g.addEventListener("lostpointercapture", () => { if (live != null) apply(live); live = null; });
    g.addEventListener("keydown", e => { if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return; e.preventDefault();
      const k = [...sec.querySelectorAll(".gutter")].indexOf(g); apply(cur() + (e.key === "ArrowRight" ? 16 : -16) * sign); sec.querySelectorAll(".gutter")[k].focus(); });
    return g;
  }
}
function paneBar(id, title, sec, panes) {
  const mv = (d) => { const L = wbLayout(), o = [...L.order], j = o.indexOf(id), k = j + d; if (k < 0 || k > 2) return; [o[j], o[k]] = [o[k], o[j]];
    wbSave({ order: o, widths: L.widths }); layoutPanes(sec, panes); const b = sec.querySelector(`[data-pane="${id}"] .panebar .ib`); if (b) b.focus(); };

    h("button", { class: "ib", type: "button", "aria-label": `Move ${id} pane right`, title: "Move right", onclick: () => mv(1) }, "▶"));

/* 📸 the browser asks which tab to share; we grab one frame and crop it to the preview */
async function capture(frame, pid, note, lane) {
  const out = note || $("#pvcapnote");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    out.textContent = "📸 Use the phone's own screenshot here — capture needs a desktop browser."; return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" }, audio: false,
      preferCurrentTab: true, selfBrowserSurface: "include" });
  } catch (e) { out.textContent = "📸 Capture cancelled."; return; }
  try {
    const v = h("video", { muted: true, playsinline: true }); v.srcObject = stream; await v.play();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const b = frame.getBoundingClientRect(), sx = v.videoWidth / innerWidth, sy = v.videoHeight / innerHeight;
    const c = h("canvas", { width: Math.round(b.width * sx), height: Math.round(b.height * sy) });
    c.getContext("2d").drawImage(v, b.left * sx, b.top * sy, b.width * sx, b.height * sy, 0, 0, c.width, c.height);
    const png = c.toDataURL("image/png");
    const a = h("a", { href: png, download: `preview-${pid}-${Date.now()}.png` }); a.click();
    const r = lane ? await api("/api/compare/capture", { project: pid, id: lane.id, lane: lane.k, png })
                   : await api("/api/preview/capture", { project: pid, png });
    out.textContent = r.ok ? `📸 saved ${r.file || "for this model"}` : `📸 downloaded · ⚠️ ${r.message || "not kept in the project"}`;
  } finally { stream.getTracks().forEach(t => t.stop()); }
}

  });
  /* 💡 Suggested model (2026-11-23): reads the task, picks from the list already loaded for this provider —
     nothing is sent anywhere. The research behind it: people pick the wrong tier for the job and never see the cost. */
  function wantFor(text) {
    const t = text.toLowerCase();
    if (!t.trim()) return null;
    if (/\b(screenshot|picture|photo|image|icon|logo|mockup|diagram|look at the)\b/.test(t)) return { use: "🖼 sees images", why: "the task mentions pictures" };
    if (/\b(research|compare|investigate|analy[sz]e|explain why|which is better|pros and cons|audit|review the design)\b/.test(t)) return { use: "🔬 reasoning / research", why: "the task asks for research or reasoning" };

    if (/\b(typo|rename|one line|small|quick|tiny|simple|colou?r|padding|label|wording)\b/.test(t)) return { use: "⚡ fast & cheap", why: "the task is small" };
    return { use: "💻 coding", why: "it's a coding task" };

  load();
  box.append(...[
    h("h2", { style: "margin:4px 0" }, "📤 Send a demo"),
    p.sensitive ? h("p", { class: "warnbox" }, "🔒 This project is sensitive — it can't go to Review.") : null,
    title, wu, models, capNote, h("div", { class: "runbar" }, sendBtn), out,
    h("details", {}, h("summary", {}, "ℹ️ What happens"),
      h("p", {}, S.mode === "connected"
        ? "Hermes holds it in 📋 Review. Scott approves with his owner PIN on the 🧪 AI Lab card. Approve runs a dry run unless he types publish; then it goes to scottchristensen.dev/lab/…"
        : "Standalone: the demo is kept on this computer. Publishing only happens through Hermes Review (connected mode).")),
    h("h2", { style: "margin:10px 0 4px" }, "📨 Sent"), sentBox,
    h("h2", { style: "margin:10px 0 4px" }, "✋ Held agent writes"), heldBox].filter(Boolean));
  return [projectRow(), box];
}

function render() {
  const main = $("#main"); main.innerHTML = "";
  clearInterval(pvTimer); pvTimer = null; pvPoll = null; clearTimeout(agTimer); clearTimeout(cmpTimer);
  main.classList.toggle("wide", view === "start" || (view === "preview" && !!S.flags.preview));
  paintProjects();
  const path = PATHS.find(p => p.id === view);
  let kids;
  if (view === "start") kids = startView();
  else if (view === "chat") kids = chatView();
  else if (view === "preview") kids = previewView();
  else if (view === "agent") kids = agentView();
  else if (view === "review") kids = reviewView();
  else if (view === "compare") kids = compareView();
  else if (view === "settings") kids = settingsView();
  else kids = [offCard(path.flag, path.sym, path.name, path.later)];
  main.append(...kids);
  $("#back").disabled = false;
  store.set("view", view);
}

(async function boot() {
  const r = await api("/api/state");
  if (!r.ok) { $("#main").innerHTML = ""; $("#main").append(h("div", { class: "offcard" }, h("div", { class: "big" }, "🔌"), h("h2", {}, "The Lab server isn't answering."))); return; }
  S = r; paintBar();
  /* always opens on the 🛠 workbench, in the last project (2026-11-22) */
  render();
})();
</script>
</body>
</html>
