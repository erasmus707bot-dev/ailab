<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📓 Craft Book — AI Lab</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
  try { var t = localStorage.getItem('ailab.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* 📓 Craft Book (2026-11-25). Lab palette; 23 px text (17pt floor), 48 px targets, no colour-only meaning. */
  :root { --r: 14px; font-size: 23px; }
  [data-theme="dark"] { --bg: #0d1520; --panel: #142133; --panel2: #1b2b40; --line: #2a3d57; --text: #e8dfc8; --dim: #b9b09c;
    --accent: #c9a54a; --accent-ink: #1a1408; --calm: #26394f; --ok: #8fbf9a; --warn: #d0ad6c; --bad: #d39a8c; }
  [data-theme="light"] { --bg: #f5f2ec; --panel: #fbf9f4; --panel2: #ece6da; --line: #d6cdbb; --text: #1d2a3a; --dim: #4f5864;
    --accent: #7a5c17; --accent-ink: #fff8e6; --calm: #e3ebf2; --ok: #3f6a4a; --warn: #775a1f; --bad: #7f4436; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
  button, select, input, textarea { font: inherit; color: inherit; }
  textarea, input, select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; width: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    background: var(--panel); border-bottom: 1px solid var(--line); min-height: 56px; }
  header .title { font-weight: 600; flex: 1; }
  .ib { background: none; border: 0; border-radius: 10px; min-width: 48px; height: 48px; display: inline-flex;
    align-items: center; justify-content: center; text-decoration: none; color: inherit; cursor: pointer; }
  main { max-width: 820px; margin: 0 auto; padding: 12px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .card, .note { grid-template-columns: minmax(0, 1fr); min-width: 0; }   /* a long tag must wrap, not widen the page (Argus 2026-11-25: 1226 px on a 393 px phone) */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
  h2 { font-size: 1.1rem; margin: 0; }
  p { margin: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > .btn { flex: 1 1 150px; }
  .btn { min-height: 48px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; }
  .btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: .55; cursor: default; }
  .dim { color: var(--dim); }
  .note { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
  .note.flag { border-color: var(--warn); border-width: 2px; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--panel2); max-width: 100%; overflow-wrap: anywhere; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  details summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; }
  #msg { position: sticky; bottom: 8px; background: var(--calm); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  #msg:empty { display: none; }
</style>
</head>
<body>
<header>
  <a class="ib" href="/" title="Back to the Lab" aria-label="Back to the Lab">←</a>
  <a class="ib" href="/" title="Home" aria-label="Home">⌂</a>
  <span class="title">📓 Craft Book</span>
  <button class="ib" id="theme" type="button" title="Light / dark" aria-label="Light or dark mode">☀️</button>
</header>
<main>
  <section class="card">
    <p>What the Lab has learned makes your pictures, clips and stories come out the way you asked. Live notes ride along with every job. 👁 scores, ✅ Keep and 🗑 Throw away decide which notes stay.</p>
    <div id="scores" class="tags"></div>
  </section>
  <section class="card" id="wait" hidden>
    <h2 id="waith">Waiting for you</h2>
    <div class="row">
      <button class="btn pri" id="all" type="button">✅ Make all of these live</button>
      <button class="btn" id="dl" type="button">⬇ Review file (.md)</button>
      <label class="btn" style="display:inline-flex;align-items:center;justify-content:center">⬆ Upload answers<input id="up" type="file" accept=".md,.txt,text/markdown,text/plain" hidden></label>
    </div>
    <div id="proposed" style="display:grid;gap:10px"></div>
  </section>
  <section class="card">
    <h2 id="liveh">Live notes</h2>
    <div id="live" style="display:grid;gap:10px"></div>
  </section>
  <section class="card">
    <details><summary>➕ Add a note of your own</summary>
      <div style="display:grid;gap:8px">
        <label>For <select id="akind"></select></label>
        <label>Do this <textarea id="ado" rows="3" placeholder="One instruction, in plain words"></textarea></label>
        <label>Only when your words say (comma list, empty = always) <input id="awhen" placeholder="fox, snow"></label>
        <button class="btn pri" id="addb" type="button">➕ Add it (live now)</button>
      </div>
    </details>
    <details><summary>🧰 More</summary>
      <div class="row">
        <button class="btn" id="undo" type="button">↶ Undo last change</button>
        <button class="btn" id="seed" type="button">📥 Load Claude's lessons (Nov 22–25)</button>
        <button class="btn" id="hand" type="button">📥 Read new handoffs</button>
      </div>
      <div id="retired" style="display:grid;gap:10px;margin-top:10px"></div>
    </details>
  </section>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  let j = {}; try { j = await r.json(); } catch (e) {}
  j.status = r.status; return j;
}
function say(t) { $("msg").textContent = t || ""; if (t) setTimeout(() => { if ($("msg").textContent === t) $("msg").textContent = ""; }, 6000); }
function paintTheme() { $("theme").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙"; }
$("theme").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t; try { localStorage.setItem("ailab.theme", t); } catch (e) {} paintTheme(); };
paintTheme();
const SRC = { seed: "✳️ from Claude's builds", handoff: "✳️ from a handoff", scott: "🙋 yours", measured: "📏 measured by 👁" };
const ICON = { picture: "🖼", video: "🎬", story: "📖", motion: "🏃", rebuild: "🎞", doc: "📝", build: "🔨", any: "✨" };
async function act(op, body, done) {
  const j = await api("/api/craft/" + op, body || {});
  if (j.status !== 200 || j.ok === false) return say("⚠️ " + (j.message || j.why || "That didn't work."));
  paint(j); say(done ? done(j) : "✅ Done");
}
function card(n) {
  const acts = h("div", { class: "row" });
  if (n.status !== "live" || n.flag) acts.append(h("button", { class: "btn pri", type: "button", onclick: () => act("live", { ids: [n.id] }) }, n.flag ? "✅ Keep it anyway" : "✅ Make live"));
  if (n.status !== "retired") acts.append(h("button", { class: "btn", type: "button", onclick: () => act("retired", { ids: [n.id] }) }, "🗑 Retire"));
  acts.append(h("button", { class: "btn", type: "button", onclick: () => {
    const t = prompt("Change the note's words:", n.do); if (t && t.trim() && t !== n.do) act("edit", { id: n.id, do: t.trim() }); } }, "✏️ Change words"));
  return h("div", { class: "note" + (n.flag ? " flag" : "") },
    n.flag ? h("p", {}, "⚠️ Used " + n.used + " times and never helped. Retire it?") : null,
    h("p", {}, n.do),
    h("div", { class: "tags" }, h("span", { class: "tag" }, (ICON[n.kind] || "") + " " + n.kind), h("span", { class: "tag" }, SRC[n.source] || n.source),
      h("span", { class: "tag" }, n.when.length ? "when: " + n.when.join(", ").replace("#count", "a number of things") : "always"),
      n.status === "live" ? h("span", { class: "tag" }, "used " + n.used + " · helped " + n.helped + " · ✅ " + n.kept + " · 🗑 " + n.tossed) : null),
    n.why ? h("p", { class: "dim" }, "Why: " + n.why) : null, acts);
}
function paint(j) {
  if (j.status === 403) { $("live").replaceChildren(h("p", {}, "📓 The Craft Book is not switched on yet. Run the go-live line from the handoff on gandalf.")); return; }
  const notes = j.notes || [], by = s => notes.filter(n => n.status === s);
  const wait = notes.filter(n => n.status === "proposed" || n.flag);
  $("wait").hidden = !wait.length;
  $("waith").textContent = "Waiting for you (" + wait.length + ")";
  $("all").hidden = !by("proposed").length;
  $("proposed").replaceChildren(...wait.map(card));
  const live = by("live").filter(n => !n.flag);
  $("liveh").textContent = "Live notes (" + live.length + ")";
  $("live").replaceChildren(...(live.length ? live.map(card) : [h("p", { class: "dim" }, "None yet. Make the waiting ones live, or add your own.")]));
  $("retired").replaceChildren(...by("retired").map(card));
  const sc = Object.entries(j.scores || {}).map(([k, s]) => h("span", { class: "tag" }, (ICON[k] || "") + " " + k + ": with notes " +
    (s.with == null ? "—" : s.with + "% (" + s.with_n + ")") + " · without " + (s.without == null ? "—" : s.without + "% (" + s.without_n + ")")));
  $("scores").replaceChildren(...(sc.length ? sc : [h("span", { class: "dim" }, "No 👁 scores yet — they show here after the next pictures.")]));
  if (!$("akind").options.length) for (const k of j.kinds || []) $("akind").append(h("option", { value: k }, (ICON[k] || "") + " " + k));
  $("undo").disabled = !j.can_undo;
}
$("all").onclick = () => act("live", { ids: ["*proposed"] }, j => "✅ " + j.changed + " notes are live. ↶ Undo is under 🧰 More.");
$("undo").onclick = () => act("undo", {}, j => j.undone ? "↶ Undone" : "Nothing to undo");
$("seed").onclick = () => act("seed", {}, j => "📥 " + j.report.added + " new, " + j.report.known + " already here");
$("hand").onclick = () => act("handoffs", {}, j => "📥 " + j.report.added + " new notes from " + j.report.files + " handoffs");
$("addb").onclick = () => { const d = $("ado").value.trim(); if (d.length < 8) return say("Write the note first.");
  act("add", { kind: $("akind").value, do: d, when: $("awhen").value }, j => { $("ado").value = ""; $("awhen").value = ""; return j.saved ? "➕ Added, live now" : "Already in the book"; }); };
$("dl").onclick = async () => { const j = await api("/api/craft?review=1"); if (!j.md) return say("⚠️ Couldn't make the file.");
  const a = h("a", { href: URL.createObjectURL(new Blob([j.md], { type: "text/markdown" })), download: "craft-review.md" }); document.body.append(a); a.click(); a.remove(); };
$("up").onchange = async e => { const f = e.target.files[0]; if (!f) return; const text = await f.text(); e.target.value = "";
  act("review", { text }, j => "⬆ " + j.report.live + " made live, " + j.report.retired + " retired. ↶ Undo is under 🧰 More."); };
api("/api/craft").then(paint);
</script>
</body>
</html>
